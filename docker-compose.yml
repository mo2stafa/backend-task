services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-task-api
    ports:
      - "${DOCKER_PORT}:3000"
    environment:
      PORT: 3000
      MONGO_URI: ${DOCKER_MONGO_URI}
      KAFKA_BROKERS: kafka:9092
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: backend-task-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for kafka topic creation..."
        kafka-topics --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic post.created \
          --partitions 1 \
          --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 \
          --describe --topic post.created
        echo "topic post.created ready"
    restart: "no"

  mongo:
    image: mongo:latest
    container_name: backend-task-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DOCKER_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DOCKER_MONGO_PASS}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: backend-task-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: backend-task-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s


volumes:
  mongo-data: